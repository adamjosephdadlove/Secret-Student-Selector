
<!DOCTYPE html>
<html>
  <head>
    <title>Secret Student Selector</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
  </head>

  <body>
    <div class="application-container">
      <div class="input-container">
        <input
          type="text"
          placeholder="Enter names separated by commas."
          id="user-content"
        />
        <button id="enter-btn" onclick="textToArray()">Enter</button>
      </div>

      <div class="std-view-container">
        <div class="std-view-header">
          <h3>Student View</h3>
        </div>

        <ul id="student-list" class="student-list"></ul>
      </div>
    </div>

    <p id="random-results" class="result-para"></p>

    <script src="index.js" defer></script>
  </body>
</html>
