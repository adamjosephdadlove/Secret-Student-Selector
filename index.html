<!DOCTYPE html>
<html>
  <head>
    <title>Secret Student Selector</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
  </head>

  <body>
     <h2 class="heading-title"> Student Selector </h2>
    <div class="application-container">
      <div class="input-container">
        <input
          type="text"
          placeholder="Enter list items separated by commas."
          id="user-content"
        />
        <button id="enter-btn" onclick="textToArray()">Enter</button>
      </div>

      <div class="std-view-container">
        <div class="std-view-header">
          <h3>List View</h3>
          <div class="header-actions">
            <button class="save-btn" onclick="saveToStorage()">Save</button>
            <button class="clear-btn" onclick="clearEntireList()">Clear All</button>
          </div>
        </div>

        <ul id="student-list" class="student-list"></ul>
      </div>
    </div>

    <div class="random-selection-container">
      <button id="random-btn" onclick="pickRandomName()">Pick a Winner!</button>
      <p id="random-results" class="result-para">Winner: </p>
    </div>

    <script src="index.js" defer></script>
  </body>
</html>
